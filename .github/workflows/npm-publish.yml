# Publish the npm wrapper package. Runs as its own workflow: ci.yml's release job
# dispatches it (`gh workflow run`) once the GitHub release exists, so a registry
# or credential failure here reddens only this run. It also runs when a release is
# published by hand in the GitHub UI, and manually (workflow_dispatch) to retry or
# to prove the credential. A release created by the pipeline's own token raises no
# `release` event, which is why the pipeline dispatches it.
#
# History (2026-09-15): v4.0.0 and v4.1.0 shipped to GitHub releases
# but npm stayed on 3.6.7 because publishing was a manual step nobody
# owned. npm users kept getting a year-old binary. This workflow
# makes the registry part of the release itself: publish the release
# and npm follows, version-matched or not at all.
#
# Guards:
# - The npm/package.json version must equal the release tag. A drift
#   fails loudly here instead of shipping a package that lies about
#   its version.
# - If the version is already on the registry the publish is skipped
#   (re-publishing the same version is an npm error).
#
# Auth: trusted publishing (OIDC) once npmjs.com trusts this workflow — one
# GitHub Actions trusted publisher for repo dondai44423/donsetch, workflow
# `npm-publish.yml`, "Allow npm publish" ticked. npm tries OIDC before any token
# and falls back to the NPM_TOKEN secret only while that publisher is absent, so
# `id-token: write` and npm >= 11.5.1 stay.

name: npm publish

permissions:
  contents: read
  id-token: write

on:
  release:
    # `released` is a normal release; publishing a beta or rc draft fires
    # `prereleased` instead, so without this line no prerelease ever reached
    # npm (the `beta` dist-tag still pointed at 0.5.0-beta.1).
    types: [released, prereleased]
  # Manual run: proves the trusted-publisher setup and the guards without minting a
  # release. Publishes the newest published release - prereleases included,
  # which `releases/latest` skips - or the tag given.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (default: the newest published release)'
        required: false
        type: string

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag under test, so npm/package.json is the one being published.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm 11.5.1+; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Assert npm version matches the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # Manual runs carry no release context: the newest published release,
          # prereleases included, or the tag given.
          if [ -z "$TAG_VERSION" ]; then
            TAG_VERSION=$(gh api repos/${{ github.repository }}/releases \
              --jq '[.[] | select(.draft == false)][0].tag_name')
            echo "manual run: testing against the newest published release $TAG_VERSION"
          fi
          TAGVER="${TAG_VERSION#v}"
          PKGVER=$(node -p "require('./npm/package.json').version")
          echo "release tag: $TAGVER / npm/package.json: $PKGVER"
          if [ "$TAGVER" != "$PKGVER" ]; then
            echo "ERROR: npm/package.json ($PKGVER) does not match the published release ($TAGVER)"
            echo "Bump npm/package.json and tag releases only after both agree."
            exit 1
          fi
          echo "RELEASE_TAG=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Assert release assets exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          expected=(
            donsetch-linux-x64.tar.gz
            donsetch-linux-x64.tar.gz.sha256
            donsetch-linux-arm64.tar.gz
            donsetch-linux-arm64.tar.gz.sha256
            donsetch-darwin-arm64.tar.gz
            donsetch-darwin-arm64.tar.gz.sha256
            donsetch-darwin-x64.tar.gz
            donsetch-darwin-x64.tar.gz.sha256
            donsetch-win32-x64.tar.gz
            donsetch-win32-x64.tar.gz.sha256
          )
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in "${expected[@]}"; do
            if ! grep -Fxq "$asset" <<< "$assets"; then
              echo "ERROR: release $TAG is missing asset $asset"
              exit 1
            fi
          done
          echo "all expected release assets exist for $TAG"

      - name: Copy LICENSE into npm package
        run: cp LICENSE npm/LICENSE

      # Proves the credential on every run, including a manual one for a
      # version already published (which skips the publish itself).
      - name: Check npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Publish (skip if already on the registry)
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "donsetch@$VERSION" version >/dev/null 2>&1; then
            echo "donsetch@$VERSION already published, skipping"
            exit 0
          fi
          # A prerelease must never take the `latest` dist-tag: 5.0.0-beta.1
          # would become what every `npm i donsetch` installs. `-beta.1`
          # publishes under `beta`, `-rc.2` under `rc`.
          DIST_TAG=latest
          case "$VERSION" in
            *-*) DIST_TAG=$(printf '%s' "${VERSION#*-}" | cut -d. -f1) ;;
          esac
          echo "publishing donsetch@$VERSION under dist-tag $DIST_TAG"
          npm publish --access public --tag "$DIST_TAG"

  notify-downstream:
    name: notify downstream repositories
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release notifications
        env:
          DOWNSTREAM_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          # Token for the latest-release lookup on manual runs (the
          # dispatch PAT below only holds the two downstream repos and
          # cannot read this one). The dispatches re-export the PAT
          # right before they run.
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DOWNSTREAM_TOKEN" ]; then
            echo "DOWNSTREAM_DISPATCH_TOKEN not set; downstream repos will pick the release up via their scheduled workflows"
            exit 0
          fi
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/${{ github.repository }}/releases \
              --jq '[.[] | select(.draft == false)][0].tag_name')
          fi
          export GH_TOKEN="$DOWNSTREAM_TOKEN"
          gh api repos/dondai44423/homebrew-donsetch/dispatches \
            --method POST -f event_type=donsetch-release -f "client_payload[tag]=$TAG"
          gh api repos/dondai44423/donsetch-dsh/dispatches \
            --method POST -f event_type=donsetch-release -f "client_payload[tag]=$TAG"
