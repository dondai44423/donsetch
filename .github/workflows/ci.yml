# DonSeTch CI.
#
# Four lean jobs, then one nightly. The shape follows what each platform
# actually proves, not a five-way matrix that recompiled the same code five
# times:
#
#   build-test (linux-x86_64)  the SEMANTIC gate: workspace clippy, the whole
#                              default suite (pdf, extract, crawl, mcp, state),
#                              the test-budget guard, the shipped binary
#                              starting, --stealth --parity. Nothing else needs
#                              to run the suite; a test in it is not
#                              platform-specific or it would be named here.
#   build-test (macos-arm64)   PLATFORM gate: clippy for the macOS cfg surface,
#                              the process/restart, path, profile and PDF tests,
#                              the binary starting, release-feature compile.
#   build-test (windows-x86_64) PLATFORM gate: compile the whole crate (the
#                              real converter is clippy --all-targets), the
#                              Windows core suite on master, release-feature
#                              compile.
#   check                      cheap gates, no build: rustfmt, the static test
#                              budget, cargo-deny.
#
# The fetch core is a workspace member: it compiles in PARALLEL with the
# product, shares one lockfile and one target cache, and its clippy runs in the
# same step as the product's. It has no CI job of its own any more.
#
# Nightly (schedule) is the only place that pays for: all five fuzz targets,
# the heavy test set (soak, corpus PDFs, timing ceilings) and the aarch64
# Linux lane. Everything expensive is scheduled, nothing per-push is.
#
# Branch protection requires these contexts on master:
#   build-test (linux-x86_64) · build-test (macos-arm64) · build-test (windows-x86_64)
# The names are deliberately unchanged; `check` is not required (it is a
# lint/format gate, not a build verdict) but still fails the run.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# One live run per pull request: a new push evicts that PR's own
# still-running checks. Pushes are keyed per SHA (branch protection reads
# per-commit results).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ── Cheap gates: no toolchain build, seconds each. ─────────────────
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test budget (fixtures and ceilings, no build)
        run: python3 scripts/test_budget.py --static
      - name: cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check --hide-inclusion-graph

  # ── A Linux build every tag proves, so no five-way release rebuild. ──
  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # Only lanes that run the suite write the machine-readable log.
      SUITE: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: --features ocr,rerank,http
            suite: full
            rustflags: ''
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            features: --features ocr,rerank
            suite: platform
            rustflags: ''
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ''
            suite: platform
            rustflags: ''
          # Nightly only: the aarch64 Linux asset, built and started on the
          # hardware it ships to (PDFium's CREL relocations and the loader
          # behaviour that once crashed call_init are arm64 concerns).
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ''
            suite: none
            rustflags: ''

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy
      - uses: actions/setup-go@v7
        if: runner.os != 'Windows'
        with:
          go-version: '>=1.22.0'
      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --no-install-recommends nasm
      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y
        shell: cmd

      # ~/.cargo (index + .crate archives) only. The compiled tree lives in
      # the cache below, which this action must not manage: its seven-day
      # cleanup would delete artifacts the build still uses (CACHING.md).
      - name: Cache ~/.cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Compute version-insensitive dep hash
        shell: bash
        run: echo "DEP_HASH=$(python3 scripts/dep-hash.py)" >> "$GITHUB_ENV"

      # One tree for the whole workspace (product + core). The key is the
      # target, the dependency hash and a hash of THIS workflow; a change to
      # the build recipe falls back to the previous entry and reuses what
      # cargo can.
      - name: Compute target/ cache key
        shell: bash
        run: |
          wf=$(sha256sum .github/workflows/ci.yml | cut -c1-8)
          echo "TARGET_CACHE_KEY=tgt-${{ matrix.target }}-${{ env.DEP_HASH }}-${wf}" >> "$GITHUB_ENV"

      - name: Restore target/
        id: target-cache
        uses: actions/cache/restore@v6
        with:
          path: target
          key: ${{ env.TARGET_CACHE_KEY }}
          restore-keys: |
            tgt-${{ matrix.target }}-${{ env.DEP_HASH }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The semantic gate. One clippy pass covers the product AND the core
      # (workspace-wide), every target, tests included.
      - name: Clippy (workspace, all targets)
        if: matrix.suite == 'full' || matrix.suite == 'platform'
        run: cargo clippy --profile ci ${{ matrix.features }} --all-targets -- -Dwarnings

      - name: The binary starts
        if: matrix.suite != 'none'
        shell: bash
        run: |
          cargo build --profile ci ${{ matrix.features }} --bin donsetch
          ./target/ci/donsetch --version

      # The full suite: everything in the default filter. Emits the
      # machine-readable log the budget guard reads.
      - name: Test (full suite)
        if: matrix.suite == 'full'
        env:
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: '1'
        run: cargo nextest run --profile ci --cargo-profile ci ${{ matrix.features }} --workspace --message-format libtest-json-plus > nextest.json
        timeout-minutes: 30

      - name: Test budget
        if: matrix.suite == 'full'
        run: python3 scripts/test_budget.py --json nextest.json

      # Platform-specific value only: process spawn and restart policy,
      # paths, profile detection, PDF (the C++ static that once crashed an
      # arm64 lane), extraction, MCP supervisor. A test here is one whose
      # behaviour differs on this OS; the rest is linux's job above.
      - name: Test (platform suite)
        if: matrix.suite == 'platform'
        shell: bash
        env:
          # The Windows lane runs the core suite only on master: a Redmond
          # path quirk would otherwise block every PR.
          EXTRA: ${{ (matrix.name == 'windows-x86_64' && github.event_name == 'pull_request') && '-E test(none)' || '' }}
        run: cargo nextest run --profile ci --cargo-profile ci ${{ matrix.features }} -E 'test(mcp::supervisor) | test(profile::) | test(pdf::) | test(extract::) | test(onnx::) | test(ghost::)' ${{ env.EXTRA }}
        timeout-minutes: 30

      # The release feature set must COMPILE on Windows; linking 300 MB of
      # MSVC ONNX is a tag-time cost (release.yml), not a per-push one.
      - name: Compile the release feature set (Windows)
        if: matrix.name == 'windows-x86_64'
        run: cargo check --profile ci --features ocr,rerank,http
        timeout-minutes: 15

      # The scorecard echo, rendered by the installed browser and diffed
      # against the local fetch: the one check that proves the identity
      # stack against a real Chrome on this platform.
      - name: Stealth parity
        if: matrix.name == 'linux-x86_64' && github.event_name != 'pull_request'
        run: ./target/ci/donsetch doctor --stealth --parity --json | head -40
        timeout-minutes: 10

      - name: Save target/
        if: success() && steps.target-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ env.TARGET_CACHE_KEY }}

  # ── Nightly only ───────────────────────────────────────────────────
  # The tests that are real but too expensive for a push: soak, corpus
  # PDFs, landmark runs, timing ceilings. They are excluded from the
  # default suite by .config/nextest.toml; this lifts that filter.
  heavy:
    name: heavy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.0'
      - run: sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --no-install-recommends nasm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Heavy set
        run: cargo nextest run --profile ci --cargo-profile ci --features ocr,rerank,http --workspace --ignore-default-filter -E 'test(soak) | test(corpus) | test(landmark) | test(pdf::tests::progit_book) | test(pdf::tests::smoke_scanned_detection) | test(pdf::tests::pdf_spec_loads) | test(search::tests::stealth_v3_preflight_batch_obeys_a_global_ceiling)' --no-fail-fast
        timeout-minutes: 45

  # All five fuzz targets, nightly. A push runs one (PRs) or none: a
  # fuzz target is a long-running search, not a per-commit verdict.
  fuzz:
    name: fuzz (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [extract, charset, paginate, sitemap, feed]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.0'
      - run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev
      - name: Fuzz (90s)
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }} artifacts/${{ matrix.target }}
          cargo fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -s none -- -max_total_time=90 -artifact_prefix=artifacts/${{ matrix.target }}/
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
