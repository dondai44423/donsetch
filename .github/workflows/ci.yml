# DonSeTch CI — build + test on Linux, macOS, Windows.
#
# Test runs use cargo-nextest with the `ci` cargo profile (release
# opts, no fat LTO), so full test links take seconds, not minutes.
# Deploy target/ artifacts are cached per platform (rust-cache), so
# steady-state Windows runs are minutes, not 20.
#
# Two payload gates beyond compilation, because compile success has
# shipped dead binaries before (v3.3.0 ONNX feature leak):
#   1. The onnx_payload_probe unit test runs inside the features-on
#      suites (linux-x64 dynamic load, macos-arm64 static link) and
#      fails if the ONNX environment cannot initialize.
#   2. Windows compile-checks the full release feature set
#      (ocr,rerank,http) without linking: MSVC's 305MB static ONNX
#      link stays a release-time cost. The complete Windows payload
#      proof (doctor probe + size gate) lives in release.yml.
#
# The heavy dependencies need platform-specific setup:
#   boring-sys (BoringSSL): CMake + C/C++ compiler + Go + bindgen (libclang)
#   PDFium (static):         curl + tar (build.rs downloads at build time)
#   oar-ocr (ONNX Runtime):  download-binaries feature fetches at build time

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    # Context MUST stay "build-test (<platform>)": master's branch
    # protection requires exactly these check names
    # (build-test (linux-x86_64) / (macos-arm64) / (windows-x86_64)).
    # GitHub generates this format for matrix jobs without an explicit
    # name; setting it explicitly keeps the required-checks contract
    # stable no matter how the matrix evolves.
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # Full feature set here: ocr+rerank (ONNX dlopen probe)
            # and http (axum/tower-http) are only CI-exercised on Linux.
            features: --features ocr,rerank,http
            release-check: false
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            # PDF code is compiled in but known-fragile on native
            # aarch64: FPDF_LoadMemDocument64 hangs in some paths
            # (crawl->pdf extraction timed out at the 30s guard in
            # the v3.4.2 arm64 experiment; the standalone pdf::
            # suite passed). Keep PDF-named tests excluded until
            # the loader hang is root-caused.
            features: ''
            extra-args: -E 'not test(pdf)'
            release-check: false
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            # Static ONNX link: the payload probe test proves the
            # archive is really linked in (the exact check that would
            # have caught v3.3.0's darwin-arm64 regression).
            features: --features ocr,rerank
            extra-args: ''
            release-check: false
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            # ort-sys has no prebuilt ONNX Runtime for x86_64-apple-darwin.
            features: ''
            extra-args: ''
            release-check: false
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # Core tests: linking 305MB of static ONNX on MSVC is a
            # release-time cost anymore (see release.yml payload gate).
            features: ''
            extra-args: ''
            release-check: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.120
        with:
          targets: ${{ matrix.target }}
          # Minimal profile: clippy/rustfmt exist only where named.
          # Clippy also runs on Windows — ghost/proc.rs is entirely
          # #[cfg(windows)], so a Linux-only lint pass never sees it.
          components: ${{ (matrix.os == 'ubuntu-latest' && 'clippy, rustfmt') || (matrix.os == 'windows-latest' && 'clippy') || '' }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.0'

      - name: Install NASM (Linux)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --no-install-recommends nasm

      - name: Install LLD (Linux ARM64)
        if: matrix.os == 'ubuntu-24.04-arm'
        timeout-minutes: 5
        run: sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --no-install-recommends lld

      - name: Install NASM (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install nasm

      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nasm -y
        shell: cmd

      - name: Install LLVM (Windows)
        if: matrix.os == 'windows-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "11.0"
          directory: ${{ runner.temp }}/llvm

      - name: Set LIBCLANG_PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $clang = (Get-Command clang).Source
          $libclangPath = Split-Path $clang
          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Add NASM to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Cache key: <target>-dep-<DEP_HASH>-ci1.
      # DEP_HASH hashes Cargo.lock + Cargo.toml with `version`
      # lines stripped. That is the single most important line in
      # this workflow: a release commit bumps the version in
      # Cargo.toml, which under rust-cache's DEFAULT keying
      # invalidates the whole dependency cache on every release
      # and turns every tag build into a 15-25 min cold rebuild
      # across 5 platforms. With version stripped, releases build
      # warm: only donsetch itself recompiles. Real dependency or
      # profile changes still change the hash and invalidate
      # correctly. CI and release use separate suffixes so the
      # release build's RUSTFLAGS artifacts never churn CI's.
      - name: Compute version-insensitive dep hash
        shell: bash
        run: |
          DEP_HASH=$(python3 - <<'EOF'
          import hashlib, pathlib, re
          h = hashlib.sha256()
          lock = pathlib.Path('Cargo.lock').read_text()
          lock = re.sub(r'name = "donsetch"\nversion = "[^"]+"',
                        'name = "donsetch"', lock)
          h.update(lock.encode())
          for p in sorted(pathlib.Path('.').rglob('Cargo.toml')):
              t = re.sub(r'\n\s*version\s*=\s*"[^"]*"', '', p.read_text())
              h.update(p.name.encode()); h.update(t.encode())
          print(h.hexdigest()[:16])
          EOF
          )
          echo "DEP_HASH=$DEP_HASH" >> "$GITHUB_ENV"

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-dep-${{ env.DEP_HASH }}-ci1
          add-rust-environment-hash-key: "false"
          # A red run must still warm the cache: the next push is
          # right behind it and should not pay full price again.
          cache-on-failure: "true"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test (nextest)
        run: cargo nextest run --profile ci --cargo-profile ci ${{ matrix.features }} --target ${{ matrix.target }} ${{ matrix.extra-args }}
        timeout-minutes: 15

      # Windows: compile-check the release feature set without the
      # 305MB MSVC static link. Catches feature-gating typos and
      # ort-sys build-script breakage at merge time; the real link
      # and the payload gates run at release time.
      - name: Compile-gate release features (Windows)
        if: matrix.release-check
        run: cargo check --profile ci --features ocr,rerank,http --target ${{ matrix.target }}
        timeout-minutes: 15

      # Two platforms, because ~32 cfg sites are Windows-exclusive
      # (all of ghost/proc.rs) and Linux clippy never compiles them.
      # macOS adds only one exclusive site — its other paths are
      # `unix` (shared with Linux) or `not(linux_like)` (shared with
      # Windows), so both are already covered here.
      #
      # --all-targets pulls in #[cfg(test)] modules and tests/*.rs,
      # which the default lib+bins pass leaves unlinted.
      # --profile ci reuses the test artifact graph (no recompile).
      - name: Clippy
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        run: cargo clippy --profile ci ${{ matrix.features }} --all-targets -- -Dwarnings
        timeout-minutes: 15

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

  # ── Supply chain: licenses + RustSec advisories + sources ──
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check advisories + licenses + bans + sources
        run: cargo deny --all-features check --hide-inclusion-graph

  # ── Fuzz smoke: short bursts on every master push keep the
  # corpus warm and catch shallow panics before users do. Long
  # runs happen locally (fuzz/README). Daemon aborts are the worst
  # failure mode for an MCP server — this is the tripwire.
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [extract, charset, paginate, sitemap, feed]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          # -Zbuild-std needs rust-src. We fuzz the GNU target —
          # boring-sys (BoringSSL C++) has no musl cross toolchain
          # here and doesn't need one.
          targets: x86_64-unknown-linux-gnu
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.0'
      - name: Install build deps (boring-sys)
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev
      - name: Fuzz (90s smoke)
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }} artifacts/${{ matrix.target }}
          cargo fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -s none -- -max_total_time=90 -artifact_prefix=artifacts/${{ matrix.target }}/
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore