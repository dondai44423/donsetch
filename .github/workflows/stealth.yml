# Identity scorecard (v5): the drift alarm.
#
# Chrome bumps stable every ~4 weeks, and an identity pinned to an old build
# rots quietly. This weekly job measures the wire every core identity actually
# sends — JA4, peetprint, the Akamai HTTP/2 fingerprint and the user agent —
# against the committed baseline in core/scorecard-baseline.json, and the
# chrome-bump job alarms when Chromium stable passes the persona's version.
#
# A red run is a re-capture task, never an automatic fix: capture the new
# reference, update the profile, then `donsetch-core scorecard --record` and
# commit the baseline deliberately.

name: stealth-scorecard

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Alert-only by design: the scorecard measures a LIVE fingerprint against
    # the baseline, and the runner's own network may differ. A red scorecard
    # must alarm in the UI but may not gate merges; the fix is a deliberate
    # re-capture.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the fetch core
        run: cargo build --profile ci -p donsetch-core

      - name: Identity scorecard
        run: ./target/ci/donsetch-core scorecard

  chrome-bump:
    needs: scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Probe the current Chromium stable (keyless) and alarm on gap
        run: |
          FEED=$(curl -fsSL "https://chromiumdash.appspot.com/fetch_milestones?num=6")
          LATEST=$(echo "$FEED" | python3 -c "import sys,json; rows=[r for r in json.load(sys.stdin) if r.get('schedule_phase')=='stable']; print(rows[0]['milestone'] if rows else 0)")
          # The v5 persona is the version every Chrome identity prints (the
          # profile underneath is a measured wire, not a version label).
          PINNED=$(python3 -c 'import json; print(json.load(open("core/personas/chrome-local.json"))["navigator"]["userAgent"].split("Chrome/")[1].split(".")[0])')
          echo "v5 persona chrome-$PINNED, current Chromium stable $LATEST"
          GAP=$((LATEST - PINNED))
          if [ "$GAP" -eq 0 ]; then
            echo "  persona is current."
          elif [ "$GAP" -eq 1 ]; then
            echo "::warning title=Chromium fingerprint fresh window::persona=$PINNED stable=$LATEST: one Chrome milestone behind; the capture window is open (capture the reference, then \`donsetch-core scorecard --record\`)"
          else
            echo "::warning title=Chromium fingerprint drift::persona=$PINNED stable=$LATEST: capture window STALE: no profile here sends the stable browser's wire; capture the reference and refresh core/personas + core/scorecard-baseline.json"
            exit 1
          fi
