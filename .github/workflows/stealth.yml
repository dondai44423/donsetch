# Stealth scorecard (v4 phase 0.4): the drift alarm.
#
# Chrome bumps stable every ~4 weeks; fingerprint mimicry pinned to
# an old build rots quietly. This weekly job captures the live
# fingerprint the fetcher emits (JA3 normalized, JA4, peetprint,
# Akamai h2, UA) and diffs every layer against the committed
# baseline. Any drift reds the run before JA4 databases catch up.
#
# When this goes red the response is deliberate, never automatic:
# re-capture the profile for the new Chrome build, verify parity,
# then `donsetch doctor --stealth-record` and commit the fixture.

name: stealth-scorecard

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the binary
        run: cargo build --profile ci --bin donsetch

      - name: Stealth scorecard
        run: ./target/ci/donsetch doctor --stealth
