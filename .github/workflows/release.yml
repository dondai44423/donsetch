# DonSeTch Release — build prebuilt binaries for Linux, macOS, Windows.
#
# Triggers on tag push (v*). Builds release binaries on 3 platforms,
# packages them with SHA256 checksums, and creates a draft GitHub
# release with all artifacts attached.
#
# Artifact naming (npm-compatible for the npm wrapper package):
#   donsetch-linux-x64.tar.gz       (Linux x86_64)
#   donsetch-linux-arm64.tar.gz     (Linux ARM64 / aarch64)
#   donsetch-darwin-arm64.tar.gz    (macOS arm64)
#   donsetch-darwin-x64.tar.gz      (macOS Intel)
#   donsetch-win32-x64.tar.gz       (Windows x86_64 + pdfium.dll)
#
# Build steps mirror ci.yml exactly (same toolchain, same deps).
# The only additions are: binary verification, packaging, checksums.

name: Release

# GITHUB_TOKEN needs contents:write to create releases and
# actions:write to upload artifacts. These are not default in
# restricted repos.
permissions:
  contents: write
  actions: write

on:
  push:
    tags:
      - 'v*'
  # Manual run: build + all gates, no publishing. Used to verify
  # baseline/glibc changes without minting a tag.
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            # Ubuntu 22.04 = the glibc 2.35 baseline: binaries
            # built here run on every distro from 22.04 up. A
            # newer builder leaks its glibc requirement into the
            # artifact (issue #93: GLIBC_2.39 binaries on 22.04).
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: --features ocr,rerank,http
            rustflags: -C target-cpu=x86-64 -C link-arg=-fuse-ld=lld
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            # PDF (core) is in; OCR/rerank off: the official ONNX
            # aarch64 prebuilt deadlocks at dlopen on native arm64.
            features: ''
            # bfd 2.38 on 22.04 cannot parse .crel relocations from
            # rustc 1.98 for aarch64 (issue #93): force lld.
            rustflags: -C link-arg=-fuse-ld=lld
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            features: --features ocr,rerank,http
            rustflags: ''
          - name: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            # ort-sys ships no prebuilt ONNX Runtime for x86_64-apple-darwin —
            # core build (same trade-off as linux-arm64).
            features: ''
            rustflags: ''
          - name: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: --features ocr,rerank,http
            rustflags: ''

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.0'

      - name: Install NASM + LLD (Linux)
        if: startsWith(matrix.os, 'ubuntu-')
        timeout-minutes: 5
        run: sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --no-install-recommends nasm lld

      - name: Install NASM (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install nasm

      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nasm -y
        shell: cmd

      - name: Install LLVM (Windows)
        if: matrix.os == 'windows-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "11.0"
          directory: ${{ runner.temp }}/llvm

      - name: Set LIBCLANG_PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $clang = (Get-Command clang).Source
          $libclangPath = Split-Path $clang
          "LIBCLANG_PATH=$libclangPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Add NASM to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Cache key: <target>-dep-<DEP_HASH>-rel1 (see ci.yml for the
      # full rationale). The version-insensitive hash is what makes
      # release builds warm: without it, every version bump nukes
      # the dependency cache and every tag build is a cold 15-25
      # min rebuild on all five platforms.
      - name: Compute version-insensitive dep hash
        shell: bash
        run: |
          DEP_HASH=$(python3 - <<'EOF'
          import hashlib, pathlib, re
          h = hashlib.sha256()
          lock = pathlib.Path('Cargo.lock').read_text()
          lock = re.sub(r'name = "donsetch"\nversion = "[^"]+"',
                        'name = "donsetch"', lock)
          h.update(lock.encode())
          for p in sorted(pathlib.Path('.').rglob('Cargo.toml')):
              t = re.sub(r'\n\s*version\s*=\s*"[^"]*"', '', p.read_text())
              h.update(p.name.encode()); h.update(t.encode())
          print(h.hexdigest()[:16])
          EOF
          )
          echo "DEP_HASH=$DEP_HASH" >> "$GITHUB_ENV"

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}-dep-${{ env.DEP_HASH }}-rel2
          add-rust-environment-hash-key: "false"
          cache-on-failure: "true"

      - name: Build
        env:
          # x86_64: target the baseline ISA (SSE2, no AVX) so Rust
          # code runs on QEMU-emulated x86_64 and older CPUs.
          # ONNX Runtime AVX is handled separately via dynamic loading
          # (ort load-dynamic + build-time .so build + runtime AVX gate).
          # Linux legs also pin -fuse-ld=lld per matrix.rustflags:
          # bfd 2.38 (22.04) cannot link rustc 1.98 output (.crel).
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked ${{ matrix.features }} --target ${{ matrix.target }}
        timeout-minutes: 30

      # NOTE: no in-tree release-mode test sweep here anymore — it
      # re-linked test binaries with fat LTO (~15 min) to re-derive
      # what the payload gates below now prove against the five
      # REAL shipping assets (version check, doctor ONNX probe,
      # size floors, dylib presence, QEMU non-AVX run).

      # Verify the binary actually runs — catches broken cross-target
      # builds, missing DLLs, and link-time issues that don't show
      # up as compile errors. Also asserts the binary reports the
      # tagged version: a missed Cargo.toml bump fails here instead
      # of shipping assets that lie about their version.
      - name: Verify binary runs and reports the tag version
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          BIN=donsetch
          if [ -f donsetch.exe ]; then BIN=donsetch.exe; fi
          output=$(./$BIN --version 2>&1 || true)
          if [ -z "$output" ]; then
            echo "ERROR: binary produced no output"
            exit 1
          fi
          echo "OK: $(echo "$output" | head -1)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGVER="${GITHUB_REF_NAME#v}"
            if ! echo "$output" | grep -q "$TAGVER"; then
              echo "ERROR: binary does not report the tagged version $TAGVER"
              echo "Did you bump Cargo.toml before tagging?"
              exit 1
            fi
          fi

      # ── Payload integrity gates ────────────────────────────
      # Compile success has shipped dead payloads before (v3.3.0:
      # the ONNX archive was silently absent from win32-x64 and
      # darwin-arm64). These gates are the tripwire: the shipped
      # bytes must be big enough to contain what they claim, the
      # Linux dylib must ship beside the binary, and `doctor` must
      # actually PROBE the ONNX payload instead of printing a
      # cfg constant.
      - name: Payload integrity gates
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          BIN=donsetch
          [ -f donsetch.exe ] && BIN=donsetch.exe
          SIZE=$(wc -c < "$BIN")
          case "${{ matrix.name }}" in
            win32-x64)    NEED=25000000; EXPECT="commit probe ok" ;;
            darwin-arm64) NEED=11000000; EXPECT="commit probe ok" ;;
            linux-x64)    NEED=15000000; EXPECT="shared library present" ;;
            *)            NEED=6000000;  EXPECT="not compiled" ;;
          esac
          if [ "$SIZE" -lt "$NEED" ]; then
            echo "payload gate FAIL: $BIN is ${SIZE} bytes, expected >= ${NEED}"
            echo "(a binary this small cannot contain the features it was built with)"
            exit 1
          fi
          if [ "${{ matrix.name }}" = "linux-x64" ]; then
            if [ ! -f libonnxruntime.so ] || [ "$(wc -c < libonnxruntime.so)" -lt 10000000 ]; then
              echo "payload gate FAIL: libonnxruntime.so missing or too small"
              exit 1
            fi
          fi
          OUT=$(./$BIN doctor 2>&1 || true)
          echo "$OUT" | grep -q "ONNX Runtime.*${EXPECT}" || {
            echo "payload gate FAIL: doctor did not report the expected ONNX state"
            echo "$OUT" | grep -i onnx || true
            exit 1
          }
          echo "payload gates ok: ${SIZE} bytes, ONNX probe: ${EXPECT}"

      # ── glibc baseline gate (Linux legs) ────────────────────
      # The binary must not demand any glibc symbol newer than
      # 2.35 (Ubuntu 22.04). This is the hard tripwire for issue
      # #93: building on a newer runner used to leak GLIBC_2.39
      # into the artifact and every 22.04 install refused to start.
      # objdump reads the ACTUAL symbol requirements of the built
      # bytes, so a regression fails the release here, not on a
      # user's VM.
      - name: Verify glibc baseline
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if ! command -v objdump >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends binutils >/dev/null 2>&1 || true
          fi
          MAXGLIBC=$(objdump -T donsetch | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "max GLIBC version required by the binary: $MAXGLIBC"
          if [ -z "$MAXGLIBC" ]; then
            echo "ERROR: no GLIBC versioned symbols found — objdump failed or binary is static"
            exit 1
          fi
          HIGHER=$(printf '2.35\n%s\n' "$MAXGLIBC" | sort -V | tail -1)
          if [ "$HIGHER" = "$MAXGLIBC" ] && [ "$MAXGLIBC" != "2.35" ]; then
            echo "ERROR: binary requires GLIBC_$MAXGLIBC, exceeds the 2.35 baseline"
            echo "Rebuild on the ubuntu-22.04 leg, or the dependency pulling the new symbol needs pinning"
            exit 1
          fi
          echo "OK: glibc baseline <= 2.35 satisfied"

      # ── QEMU non-AVX verification (Linux x64 only) ──────────
      #
      # The binary must run on non-AVX CPUs without SIGILL. QEMU's
      # qemu64 CPU model has SSE2 only (no AVX). If the binary crashes
      # here, the ONNX dynamic loading fix is broken. This catches
      # regressions where AVX instructions leak into the base binary.
      - name: Verify no SIGILL on non-AVX CPU (QEMU)
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null 2>&1 || true
          cd target/${{ matrix.target }}/release
          # Clear AVX cache so the CPUID check is actually performed.
          rm -f ~/.cache/donsetch/avx.json 2>/dev/null || true
          output=$(qemu-x86_64 -cpu qemu64 ./donsetch --version 2>&1 || true)
          if [ -z "$output" ]; then
            echo "ERROR: binary crashed (SIGILL) on non-AVX CPU (QEMU qemu64)"
            exit 1
          fi
          echo "OK: binary runs on non-AVX CPU (QEMU qemu64)"
          echo "$output" | head -1

      # Package only DonSeTch release assets. CloakBrowser remains a
      # user-managed runtime dependency and is never bundled here.
      # All platforms: tar.gz. Windows includes pdfium.dll alongside
      # donsetch.exe. Using tar.gz (not zip) for all platforms means
      # the npm install.js postinstall only needs one extraction method.

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          # Include ONNX shared lib if present (Linux x64 + arm64,
          # shipped by build.rs for runtime dlopen). macOS/Windows
          # use static linking.
          if [ -f libonnxruntime.so ]; then
            tar czf $GITHUB_WORKSPACE/donsetch-${{ matrix.name }}.tar.gz donsetch libonnxruntime.so
          else
            tar czf $GITHUB_WORKSPACE/donsetch-${{ matrix.name }}.tar.gz donsetch
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          cd target\${{ matrix.target }}\release
          if not exist pdfium.dll (
            echo ERROR: pdfium.dll not found - build.rs copy failed
            exit 1
          )
          tar czf %GITHUB_WORKSPACE%\donsetch-${{ matrix.name }}.tar.gz donsetch.exe pdfium.dll

      # ── Checksums ────────────────────────────────────────────
      # sha256sum format: "<hash>  <filename>" — compatible with
      # `sha256sum -c` on Linux/macOS.

      - name: Compute SHA256
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum donsetch-${{ matrix.name }}.tar.gz | tee donsetch-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: donsetch-${{ matrix.name }}
          path: donsetch-${{ matrix.name }}.*

  release:
    name: Create Release
    needs: build
    # Dispatch runs exercise build + every gate without publishing.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # Curated release notes: extract this version's section from
      # CHANGELOG.md so the release page reads like the changelog,
      # not like a commit log. GitHub's auto-generated notes are
      # appended below it.
      - name: Build release notes from CHANGELOG
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os, re, sys
          tag = os.environ["TAG_VERSION"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(tag) + r"\] - .*?$", text, re.M)
          if not m:
              sys.exit(f"CHANGELOG.md has no [{tag}] section — add it before tagging")
          start = m.end()
          nxt = re.search(r"^## \[.*?\]", text[start:], re.M)
          section = text[start:start + nxt.start()] if nxt else text[start:]
          header = f"DonSeTch v{tag}\n\n"
          open("RELEASE_BODY.md", "w", encoding="utf-8").write(header + section.strip() + "\n")
          print(f"RELEASE_BODY.md: {len(section.splitlines())} lines from [{tag}]")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          files: |
            artifacts/donsetch-*.tar.gz
            artifacts/donsetch-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
