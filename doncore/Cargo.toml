[package]
name = "doncore"
version = "0.1.0"
edition = "2021"
# The engine ships as part of donsetch — never on its own.
publish = false
description = "The v5 fetching engine: one wire, one jar, one cache, one JS runtime"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
rquickjs = { version = "0.14.0", features = ["full"] }
rquickjs-sys = { path = "vendor/rquickjs-sys", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
httpdate = "1"
sha2 = "0.11"
wreq = { version = "6.0.0-rc.31", default-features = false, features = ["tokio-rt", "gzip", "brotli", "zstd", "deflate", "charset", "cookies", "stream", "socks"] }
wreq-util = "3.0.0-rc.14"
tokio = { version = "1", features = ["rt", "macros", "time"] }
scraper = { version = "0.24", features = ["deterministic"] }
ego-tree = "0.10"
url = "2"
# App-facing wire surface: capped streaming reads (futures-util) and the
# same charset decode `text()` uses (encoding_rs + mime).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
encoding_rs = "0.8"
mime = "0.3"

# Windows-native host facts (memory: GlobalMemoryStatusEx; battery:
# GetSystemPowerStatus). Target-gated — never compiled on Linux/macOS; the
# version matches the lock's transitive windows-sys (0.61.2).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_SystemInformation",
    "Win32_System_Power",
] }

# Local patches (this crate is its own workspace root until the donsetch swap
# links it into the app graph):
#  wreq/btls-sys: Chrome ClientHello parity (trust_anchors extension +
#  signature-algorithm list) that the published presets cannot express.
#  rquickjs-sys: native Function.prototype.toString in V8's single-line
#  shape — stock QuickJS's multiline suffix made eval.toString() 37 chars.
[patch.crates-io]
wreq = { path = "vendor/wreq" }
btls-sys = { path = "vendor/btls-sys" }
rquickjs-sys = { path = "vendor/rquickjs-sys" }
