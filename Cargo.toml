# One workspace: the product (this crate, at the root) and its fetch layer
# (crates/fetch). They compile in parallel, and share one profile, one lockfile
# and one artifact cache.
[workspace]
members = ["crates/fetch"]
# fuzz/ is a standalone crate with its own lock and nightly toolchain; it must
# not be captured by the workspace manifest above.
exclude = ["fuzz"]
resolver = "2"

[package]
name = "donsetch"
version = "5.3.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Web fetch, search and crawl for AI agents."

[dependencies]
# The fetch layer, in-tree: carried identity and learned state per origin,
# the page cache, data paths and the in-process V8 challenge engine.
donsetch-fetch = { path = "crates/fetch" }
tokio = { version = "1", features = ["full"] }
url = "2"
brotli = "9"
memchr = "2"
flate2 = "1"
zstd = "0.14.3"
rustls-native-certs = "0.8"
scraper = "0.27.0"
# The tree scraper parses into: node ids for one-pass DOM measurements.
ego-tree = "0.11"
encoding_rs = "0.8.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httpdate = "1.0.3"
config = { version = "0.15", default-features = false, features = ["toml"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
# HTTP server for MCP HTTP transport (axum, SSE). Optional: gates
# the --http flag. Adds significant compile time (axum + tower-http).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
libc = "0.2"
dirs = "6"
unicode-bidi = "0.3"
# OCR tier (Tier B) — PP-OCR via ONNX Runtime, lazy model cache.
oar-ocr = { version = "0.9", default-features = false, features = ["download-binaries", "simd"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
sha2 = "0.11"
base64 = "0.23"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# `deflate-flate2`, not `deflate`: zip's `deflate` also turns on
# `flate2/zlib-rs`, and Cargo's feature unification then makes zlib-rs
# flate2's backend for the whole build, replacing miniz_oxide (which our own
# `flate2 = "1"` selects by default) under every gzip/deflate path in fetch,
# not just zip. `deflate-flate2` reads and writes deflate through whatever
# backend flate2 already has. The swap is not neutral: zlib-rs's level 1
# never falls back to stored blocks, so incompressible input grows ~6% per
# pass, and the 200-layer gzip test in fetch/decompress.rs went from under a
# second to a 60 s timeout.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Probe mode (must_contain): pattern verification against fetched
# content. Pure Rust, no unsafe.
regex = "1"
# CLI subcommands: self-update, doctor.
tar = "0.4"
semver = "1"
# Agent CLI: spec-driven command generation (builder API, no derive).
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
psl = { version = "=2.1.246" }
# OCR support deps. `ort` itself goes ONLY in the per-target section
# below, never here: Cargo unions features across every matching target
# section, so declaring it in more than one place is how `load-dynamic` once
# leaked onto macOS and silently stripped ONNX from those builds (the 3.3.0
# bug — full story in src/onnx.rs). One section, one feature set, since #316.
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }

# Every ONNX target dlopen's Microsoft's shared library at runtime: the
# prebuilt static archives run unguarded AVX in C++ global constructors and
# SIGILL pre-`main` on non-AVX CPUs (#57, #277), and one `load-dynamic`
# config removes the feature-union hazard the old Linux/Windows vs macOS
# split carried (#316). build.rs pins the version (1.24.2 Linux/Windows;
# 1.23.2 macOS, the last Developer-ID-signed macOS build) and its sha256,
# and the library sits beside the binary, loaded from there at runtime.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "api-23"], optional = true }

[features]
# No default features — the core tool (fetch, search, crawl, PDF)
# works standalone. OCR pulls in ONNX Runtime, a heavy C++ dependency whose
# static global constructors can deadlock on some platforms (notably aarch64
# Linux, see issue #9). `http` adds the axum HTTP transport. Search never uses
# ONNX and never loads a model: it is pure Rust, and OCR is its only consumer
# (5.3.0 §8). CI and release builds pick features per target: the full
# `--features ocr,http` where supported, fewer or none elsewhere (see the
# matrices in .github/workflows/ci.yml).
default = []
ocr = ["dep:oar-ocr", "dep:image", "dep:ort", "dep:tokenizers", "reqwest/blocking"]
http = ["dep:axum", "dep:tower-http"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Pipes"] }

[dev-dependencies]
# The owned-browser pixel test decodes a PNG; the optional runtime dep
# rides the ocr feature, and no-feature test builds (CI linux-aarch64,
# windows) must still compile the test.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Paused-time tests (Builder::start_paused via #[tokio::test]): the
# stall-vs-wall semantics run against the real 30s constants without
# sleeping 30 real seconds.
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
sha2 = "0.11"
flate2 = "1"
# Microsoft ships the Windows ONNX Runtime as a zip; same pin as the
# runtime dependency above (features included, for the reason given there),
# so the lock is unchanged.
zip ={ version = "9", default-features = false, features = ["deflate-flate2"] }

# cfg() on build-dependencies resolves against the HOST, not the target, so this
# only applies when building *on* Windows -- matching the #[cfg(windows)] gate on
# the version-resource code in build.rs. Cross-compiling to Windows from another
# host therefore yields an exe with no version resource; if that is ever needed,
# move this to the plain [build-dependencies] above and drop the #[cfg(windows)]
# in build.rs.
[target.'cfg(windows)'.build-dependencies]
# default-features = false drops the "toml" feature, which only exists to parse
# [package.metadata.winresource]; build.rs sets every field programmatically.
winresource = { version = "0.1", default-features = false }

# Every diagnostic goes through `diag!` (src/diag.rs): std's stderr
# print macros panic when the write fails, and the shipped profile is
# `panic = "abort"`, so a closed stderr pipe aborted the MCP daemon
# mid-session (#364). Denied at the package level so a raw stderr print
# cannot come back -- `just lint` and CI fail on one. `writeln!` to
# stderr is what `diag!` expands to, so it is not flagged.
[lints.clippy]
print_stderr = "deny"

# The default profile, reached only by a bare `cargo build` / `cargo test` —
# not this repo's loop (CONTRIBUTING.md: use the `just` recipes; the fast
# profile above is the loop). Left at its default it is the one shape that
# writes full DWARF for this crate and all 512 deps: touching it by hand
# minted 2.2G of target/debug by 2026-10-30. line-tables-only keeps the
# file:line in a panic backtrace and drops the rest of it. Nothing here
# reaches `fast`, `ci` or the shipped `release` profile.
[profile.dev]
debug = "line-tables-only"
# 256 codegen units is the historical default; it multiplies LLVM work and
# peak memory per rustc without making the debug binary faster to run.
codegen-units = 16

# THREE profiles, each answering one question:
#
#   fast       the edit loop AND every test lane in CI (below). Opt-level 0 for
#              this workspace, 1 for dependencies, no debuginfo.
#   dist-thin  the SHIPPED shape: what the release pipeline builds and ships,
#              and what the nightly heavy tests (soak, corpus, timing) run on,
#              because those measure time and memory.
#   release    thin LTO for `cargo build --release` on a developer machine only.
#
# There used to be two more (`ci`, `dist`). A test lane on release opts
# compiled the 91k-line product crate at opt-level 3 twice per CI leg, and a
# fat-LTO `dist` cost 20-26 minutes per platform, so both were removed: tests
# do not need release opts (the shipped artifact is gated by scripts/gates.sh
# instead), and thin LTO bought a few percent of size and speed at best.

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

# What the release pipeline builds and ships. No LTO: opt-level 3 with 16
# codegen units is the whole cost, and the payload gates prove the result runs.
[profile.dist-thin]
inherits = "release"
lto = false
codegen-units = 16

# The edit loop and the CI test lanes: debug codegen for this crate (an edit
# rebuilds in seconds), dependencies at opt-level 1 (unoptimized deps made the
# suite crawl), no debuginfo (linking 91k LOC + 512 deps with full DWARF is its
# own tax), incremental for the edit-test loop (CI sets CARGO_INCREMENTAL=0,
# which wins over this). The heavy suite runs on `dist-thin`.
[profile.fast]
inherits = "dev"
debug = 0
incremental = true
codegen-units = 16

[profile.fast.package."*"]
opt-level = 1
codegen-units = 16

# The fetch layer's vendored forks: patches apply from the workspace ROOT
# (core keeps the same table for its standalone builds).
#  wreq/btls-sys: Chrome ClientHello parity (trust_anchors extension +
#  signature-algorithm list) that the published presets cannot express.
[patch.crates-io]
wreq = { path = "crates/fetch/vendor/wreq" }
btls-sys = { path = "crates/fetch/vendor/btls-sys" }
