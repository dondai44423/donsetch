# Pin the toolchain for local builds AND CI: .github/actions/setup reads
# this file's channel, so there is exactly one version in the repo. A local
# clippy newer or older than CI's reports a different lint set, so
# `-Dwarnings` can be red here and green there — or, worse, the reverse.
# Bump this file deliberately, with `just all` run on the new version.
# rustup installs the components on first use.
[toolchain]
channel = "1.98"
components = ["clippy", "rustfmt"]
