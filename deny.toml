# cargo-deny configuration — supply-chain gate for CI.
#
# Checks: licenses (we are AGPL-3.0; deps must be permissive or
# OSI-acceptable), security advisories (RustSec), duplicate crate
# versions (bloat signal), and banned sources.

[graph]
# Check all feature combinations that matter: the default core
# build and the full ocr+rerank build.
all-features = true

[advisories]
version = 2
# Unmaintained crates: warn, don't block — an unmaintained transitive
# dep is common and usually harmless; the maintainers bump it soon.
yanked = "warn"
# Unmaintained transitive deps (paste, ttf-parser — via scraper/image;
# nothing actionable until upstream bumps): acknowledged, not blocking.
ignore = [
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0192", # ttf-parser
]

[licenses]
version = 2
# DonSeTch is AGPL-3.0. Dependencies may be permissive (MIT,
# Apache-2.0, BSD, ISC, MPL-2.0, zlib) or the OpenSSL license
# (BoringSSL). Copyleft deps would taint distribution — deny them.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "AGPL-3.0-only",
    # libFuzzer runtime (fuzz targets only) — the LLVM license family.
    "NCSA",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.93

[bans]
# Duplicate versions: warn (some duplication is unavoidable in a
# BoringSSL + tokio + scraper graph).
multiple-versions = "warn"
deny = []
skip = []
skip-tree = []

[sources]
# Only crates.io + vendored paths (PDFium static libs are fetched
# by build.rs, not a registry dep) + the donsetch quiche fork the
# h3 lane pins by tag (3cf7a49; boring lifted to ^5 there so one
# BoringSSL build serves h1/h2 and QUIC).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/dondai44423/quiche"]
